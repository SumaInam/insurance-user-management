<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Forgot Password</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="page-container">

    <div class="form-card">

        <h2>🔐 Forgot Password</h2>

        <form th:action="@{/forgot-password}"
              method="post">

            <div class="form-group">

                <label>Email Address</label>

                <input type="email"
                       name="email"
                       required>

            </div>

            <div class="form-group">

                <label>New Password</label>

                <input type="password"
                       name="newPassword"
                       required>

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input type="password"
                       name="confirmPassword"
                       required>

            </div>

            <button type="submit"
                    class="update-btn">

                Reset Password

            </button>

        </form>

        <br>

        <a th:href="@{/login-page}"
           class="back-btn">

            ← Back To Login

        </a>

    </div>

</div>

</body>

</html>
